<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<title>Campfire</title>
<meta name="description" content="A realistic interactive 3D campfire in the browser. Volumetric flames, physics logs, sparks, smoke, marshmallows.">
<style>
  :root {
    --ink: #eadfce;
    --ink-dim: rgba(234, 223, 206, 0.55);
    --glass: rgba(14, 11, 9, 0.52);
    --line: rgba(255, 230, 200, 0.09);
    --warm: #ffc98a;
    --alert: #ff6a4a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  #loader { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; transition: opacity 1.2s ease; z-index: 10; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loadlabel { font-size: 12px; letter-spacing: 0.08em; color: var(--ink-dim); min-height: 1em; }
  #track { width: 160px; height: 1px; background: rgba(255,255,255,0.08); margin: 0 auto; overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--warm); box-shadow: 0 0 10px var(--warm); transition: width 0.4s ease; }

  #intro { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; z-index: 9; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity 1.4s ease; }
  #intro.show { opacity: 1; pointer-events: auto; }
  #intro h1 { margin: 0 0 14px; font-weight: 300; font-size: clamp(40px, 7vw, 76px); letter-spacing: 0.32em; padding-left: 0.32em; color: #fff3e2;
    text-shadow: 0 0 40px rgba(255, 140, 50, 0.35); }
  #intro p { margin: 0; font-size: 13px; letter-spacing: 0.14em; color: var(--ink-dim); }
  #intro p span { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

  #ui { opacity: 0; transition: opacity 1.2s ease 0.4s; pointer-events: none; }
  #ui.show { opacity: 1; }
  #ui.show .live { pointer-events: auto; }

  .glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); }

  #dock { position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #toolbar { display: flex; gap: 4px; padding: 5px; border-radius: 999px; }
  .tool { position: relative; width: 46px; height: 46px; border-radius: 999px; border: 0; background: transparent; color: var(--ink-dim); cursor: pointer;
    display: grid; place-items: center; transition: background 0.25s ease, color 0.25s ease, transform 0.2s cubic-bezier(.3,1.6,.5,1); }
  .tool:hover { color: var(--ink); background: rgba(255,255,255,0.05); }
  .tool:active { transform: scale(0.92); }
  .tool.active { color: var(--warm); background: rgba(255, 170, 80, 0.14); }
  .tool svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tool .tip { position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%) translateY(4px); white-space: nowrap; font-size: 11px; letter-spacing: 0.04em;
    padding: 5px 9px; border-radius: 8px; color: var(--ink); opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; }
  .tool .tip kbd { font: inherit; opacity: 0.5; margin-left: 6px; }
  @media (hover: hover) { .tool:hover .tip { opacity: 1; transform: translateX(-50%) translateY(0); } }

  #hint { font-size: 11.5px; letter-spacing: 0.03em; color: var(--ink-dim); text-align: center; max-width: min(92vw, 560px); line-height: 1.5; text-shadow: 0 1px 8px #000; }

  #status { position: fixed; left: 50%; bottom: calc(max(26px, env(safe-area-inset-bottom)) + 96px); transform: translateX(-50%) translateY(6px);
    font-size: 13px; padding: 8px 14px; border-radius: 999px; opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease, color 0.3s; white-space: nowrap; }
  #status.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #status.alert { color: var(--alert); }
  #eat { position: fixed; left: 50%; bottom: calc(max(26px, env(safe-area-inset-bottom)) + 140px); transform: translateX(-50%) scale(0.9); padding: 8px 18px; border-radius: 999px;
    font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s cubic-bezier(.3,1.6,.5,1); }
  #ui.show #eat.show { opacity: 1; transform: translateX(-50%) scale(1); pointer-events: auto; }
  #eat:hover { color: var(--warm); }

  #flash { position: fixed; top: max(22px, env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -10px); font-size: 13px; padding: 9px 16px; border-radius: 999px;
    opacity: 0; transition: opacity 0.35s ease, transform 0.35s cubic-bezier(.3,1.4,.5,1); pointer-events: none; white-space: nowrap; }
  #flash.show { opacity: 1; transform: translate(-50%, 0); }

  #corner { position: fixed; top: max(18px, env(safe-area-inset-top)); right: max(18px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 4px; padding: 5px 6px 5px 12px; border-radius: 999px; }
  #corner svg { width: 18px; height: 18px; stroke: var(--ink-dim); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  #wind { -webkit-appearance: none; appearance: none; width: 92px; height: 20px; background: transparent; margin: 0 6px 0 8px; cursor: pointer; }
  #wind::-webkit-slider-runnable-track { height: 2px; background: rgba(255,255,255,0.14); border-radius: 2px; }
  #wind::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); margin-top: -6px; box-shadow: 0 0 8px rgba(0,0,0,0.5); }
  #wind::-moz-range-track { height: 2px; background: rgba(255,255,255,0.14); }
  #wind::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--ink); }
  #sound { width: 34px; height: 34px; border-radius: 999px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
  #sound:hover { background: rgba(255,255,255,0.06); }
  #sound .x { display: none; }
  #sound.off .x { display: inline; }
  #sound.off .w { display: none; }

  @media (max-width: 520px) {
    .tool { width: 44px; height: 44px; }
    #hint { font-size: 11px; }
    #wind { width: 70px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
  }
}
</script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="loader"><div id="loadlabel">Gathering firewood…</div><div id="track"><div id="bar"></div></div></div>
<div id="intro"><h1>CAMPFIRE</h1><p><span>Click to sit down</span> &nbsp;·&nbsp; headphones on</p></div>

<div id="ui">
  <div id="flash" class="glass"></div>
  <div id="status" class="glass"></div>
  <button id="eat" class="glass live">Eat it</button>

  <div id="corner" class="glass live">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h16a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>
    <input id="wind" type="range" min="0" max="100" value="18" aria-label="Wind">
    <button id="sound" aria-label="Sound">
      <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6"/><path class="w" d="M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 10l4 4M20 10l-4 4"/></svg>
    </button>
  </div>

  <div id="dock">
    <div id="toolbar" class="glass live">
      <button class="tool" data-tool="hand" aria-label="Hand">
        <svg viewBox="0 0 24 24"><path d="M8 12.5V6.2a1.4 1.4 0 0 1 2.8 0V11"/><path d="M10.8 10.5V4.6a1.4 1.4 0 0 1 2.8 0v5.9"/><path d="M13.6 10.5V5.8a1.4 1.4 0 0 1 2.8 0v6"/><path d="M16.4 11.5V8.6a1.4 1.4 0 0 1 2.8 0V14a7 7 0 0 1-7 7h-.6a6.5 6.5 0 0 1-5.3-2.8l-2.4-3.6a1.5 1.5 0 0 1 2.3-1.9L8 14.5"/></svg>
        <span class="tip glass">Hand<kbd>1</kbd></span>
      </button>
      <button class="tool" data-tool="log" aria-label="Add log">
        <svg viewBox="0 0 24 24"><ellipse cx="6" cy="12" rx="3" ry="5"/><path d="M6 7h12a3 5 0 0 1 0 10H6"/><path d="M6 10.5a1.2 1.6 0 1 0 .01 0"/><path d="M11 9.5h4M10 14.5h5"/></svg>
        <span class="tip glass">Add log<kbd>2</kbd></span>
      </button>
      <button class="tool" data-tool="water" aria-label="Water">
        <svg viewBox="0 0 24 24"><path d="M12 3.5c3.2 4 6 7.3 6 10.6a6 6 0 0 1-12 0c0-3.3 2.8-6.6 6-10.6z"/><path d="M9 14.5a3 3 0 0 0 3 3"/></svg>
        <span class="tip glass">Water<kbd>3</kbd></span>
      </button>
      <button class="tool" data-tool="match" aria-label="Match">
        <svg viewBox="0 0 24 24"><path d="M6 20l8.5-8.5"/><circle cx="15.6" cy="10.4" r="1.6"/><path d="M17 5.5c1.6 1.2 2.6 2.7 2.2 4.2-.3 1.2-1.4 1.9-2.4 1.6"/></svg>
        <span class="tip glass">Match<kbd>4</kbd></span>
      </button>
      <button class="tool" data-tool="marshmallow" aria-label="Marshmallow">
        <svg viewBox="0 0 24 24"><path d="M3.5 20.5l9-9"/><rect x="12" y="4.5" width="7.5" height="7" rx="2.6" transform="rotate(45 15.75 8)"/></svg>
        <span class="tip glass">Marshmallow<kbd>5</kbd></span>
      </button>
    </div>
    <div id="hint"></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
